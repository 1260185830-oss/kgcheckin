name: 订阅转换 - 三毛机场 → 小火箭

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时更新
  workflow_dispatch:  # 手动触发

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests pyyaml
      
      - name: Convert subscription
        run: python3 sub/convert.py
      
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sub/smjcdh_latest.txt
          git diff --staged --quiet || git commit -m "auto update subscription $(date +%Y-%m-%d_%H:%M)"
          git push
